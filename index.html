    <!-- 公开大厅弹窗 -->
    <div id="hallModal" class="hall-modal">

                <button onclick="closeHall()">关闭</button>

    <div class="main-container">

    <script>
        let isRunMode = false;

        function getHallData() {
            const data = localStorage.getItem('jkai_notebook_hall');
            return data ? JSON.parse(data) : [
                { id: 1, title: "欢迎来到创意大厅", content: "<h2>Hello Jkai!</h2><p>这是一个由社区成员发布的示例网页。你也可以随时在这里写 HTML 并在上方点击【HTML 实时运行】查看效果！</p>", font: "sans-serif" }
            ];
        }

        function openHall() {
            const modal = document.getElementById('hallModal');
            const listContainer = document.getElementById('hallList');
            const items = getHallData();
            
            listContainer.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'hall-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.title || '无标题作品'}</strong>
                        <p style="font-size: 12px; color: #888;">版本：HTML/多媒体作品</p>
                    </div>
                    <button class="btn-primary" onclick="loadHallItem(${item.id})">查看/加载</button>
                `;
                listContainer.appendChild(div);
            });
            modal.style.display = 'flex';
        }

        function closeHall() {
            document.getElementById('hallModal').style.display = 'none';
        }

        function publishToHall() {
            const title = document.querySelector('.title-input').value;
            const content = document.getElementById('editor').innerHTML;
            if(!title && !content) { alert('请输入内容后再发布到大厅！'); return; }
            
            const items = getHallData();
            const newItem = { id: Date.now(), title: title || '未命名作品', content, font: document.getElementById('editor').style.fontFamily };
            items.unshift(newItem);
            localStorage.setItem('jkai_notebook_hall', JSON.stringify(items));
            alert('🚀 成功发布到社区大厅！点击左上角【创意大厅广场】即可看到你的作品。');
        }

        function loadHallItem(id) {
            const items = getHallData();
            const target = items.find(i => i.id === id);
            if(target) {
                document.querySelector('.title-input').value = target.title;
                document.getElementById('editor').innerHTML = target.content;
                closeHall();
            }
        }

        // Word 风格多色荧光高亮函数
        function highlightSelection(colorClass) {
            if (!colorClass) return;
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            if (range.collapsed) {
                alert('请先用鼠标或手指选中你要高亮的文字！');
                document.getElementById('highlightColorSelector').selectedIndex = 0;
                return;
            }
            const mark = document.createElement('mark');
            mark.className = colorClass;
            mark.appendChild(range.extractContents());
            range.insertNode(mark);
            selection.removeAllRanges();
            document.getElementById('highlightColorSelector').selectedIndex = 0;
        }

        // 实时 HTML 运行模式
        function toggleRunMode() {
            const editor = document.getElementById('editor');
            const container = document.getElementById('rawPreviewContainer');
            const frame = document.getElementById('rawPreviewFrame');
            const btn = document.getElementById('modeBtn');

            isRunMode = !isRunMode;

            if (isRunMode) {
                editor.style.display = 'none';
                container.style.display = 'block';
                btn.classList.add('btn-active');
                btn.textContent = '✏️ 返回编辑模式';

                const htmlContent = editor.innerHTML;
                const font = document.getElementById('fontFamilySelector').value;
                const fullDoc = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
                    body { font-family: ${font}; padding: 20px; color: #222; background: #fff; line-height: 1.6; } 
                    mark.highlight-yellow { background-color: #ffff00; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-green { background-color: #00ff00; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-cyan { background-color: #00ffff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-magenta { background-color: #ff00ff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-blue { background-color: #0000ff; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-red { background-color: #ff0000; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-darkblue { background-color: #000080; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-darkcyan { background-color: #008080; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-darkgreen { background-color: #008000; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-darkmagenta { background-color: #800080; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-darkred { background-color: #800000; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-darkyellow { background-color: #808000; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-darkgray { background-color: #808080; color: #fff; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-lightgray { background-color: #c0c0c0; padding: 2px 4px; border-radius: 3px; }
                    mark.highlight-black { background-color: #000000; color: #fff; padding: 2px 4px; border-radius: 3px; }
                </style></head><body>${htmlContent}</body></html>`;
                const doc = frame.contentDocument || frame.contentWindow.document;
                doc.open(); doc.write(fullDoc); doc.close();
            } else {
                container.style.display = 'none';
                editor.style.display = 'block';
                btn.classList.remove('btn-active');
                btn.textContent = '⚡ HTML 实时运行';
            }
        }

        function changeFontFamily(fontFamily) {
            document.getElementById('editor').style.fontFamily = fontFamily;
            document.querySelector('.title-input').style.fontFamily = fontFamily;
        }

        function changeFontSize(size) {
            document.getElementById('editor').style.fontSize = size;
        }

        function secureShare() {
            const title = document.querySelector('.title-input').value;
            const content = document.getElementById('editor').innerHTML;
            const font = document.getElementById('editor').style.fontFamily;
            const payload = { title, content, font, time: new Date().toISOString() };
            const secureToken = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            prompt("✅ 您的笔记已生成【安全加密分享码】：", `JkaiSecureNote_v1:${secureToken}`);
        }

        function insertSketchPad() {
            const editor = document.getElementById('editor');
            const canvasId = 'canvas-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.className = "sketch-box";
            wrapper.contentEditable = "false";
            wrapper.innerHTML = `
                <div class="sketch-header">
                    <span>✍️ 手写画板</span>
                    <div>
                        <button onclick="clearCanvas('${canvasId}')" style="padding: 2px 6px; font-size: 12px;">清空</button>
                        <button onclick="this.parentElement.parentElement.parentElement.remove()" style="padding: 2px 6px; font-size: 12px;">删除</button>
                    </div>
                </div>
                <canvas id="${canvasId}" class="sketch-canvas" width="600" height="300"></canvas>
            `;
            editor.appendChild(wrapper);

            setTimeout(() => {
                const canvas = document.getElementById(canvasId);
                const ctx = canvas.getContext('2d');
                ctx.strokeStyle = '#222222'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                let painting = false;

                function getPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return { x: clientX - rect.left, y: clientY - rect.top };
                }

                function startPosition(e) { painting = true; draw(e); }
                function endPosition() { painting = false; ctx.beginPath(); }
                function draw(e) {
                    if (!painting) return;
                    e.preventDefault();
                    const pos = getPos(e);
                    ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
                }

                canvas.addEventListener('mousedown', startPosition);
                canvas.addEventListener('mouseup', endPosition);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('touchstart', startPosition);
                canvas.addEventListener('touchend', endPosition);
                canvas.addEventListener('touchmove', draw);
            }, 100);
        }

        function clearCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 本地图片上传处理
        function insertLocalImage() {
            document.getElementById('localImageInput').click();
        }

        function handleLocalImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const wrapper = document.createElement('div');
                wrapper.contentEditable = "false";
                wrapper.style.position = "relative";
                wrapper.style.margin = "12px 0";
                wrapper.style.display = "inline-block";
                wrapper.style.maxWidth = "100%";
                wrapper.innerHTML = `
                    <div style="position: absolute; top: 8px; right: 8px; z-index: 10;">
                        <button onclick="this.parentElement.parentElement.remove()" style="background: #ff3b30 !important; color: white !important; border: none; padding: 6px 10px; font-size: 14px; border-radius: 6px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">✖ 删除图片</button>
                    </div>
                    <img src="${e.target.result}" style="max-width:100%; border-radius:8px; display:block;" />
                `;
                document.getElementById('editor').appendChild(wrapper);
                input.value = ''; // 清空以允许重复选择同一文件
            };
            reader.readAsDataURL(file);
        }

        // 本地视频上传处理
        function insertLocalVideo() {
            document.getElementById('localVideoInput').click();
        }

        function handleLocalVideo(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const wrapper = document.createElement('div');
                wrapper.contentEditable = "false";
                wrapper.style.position = "relative";
                wrapper.style.margin = "12px 0";
                wrapper.style.width = "100%";
                wrapper.innerHTML = `
                    <div style="position: absolute; top: 8px; right: 8px; z-index: 10;">
                        <button onclick="this.parentElement.parentElement.remove()" style="background: #ff3b30 !important; color: white !important; border: none; padding: 6px 10px; font-size: 14px; border-radius: 6px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">✖ 删除视频</button>
                    </div>
                    <video controls src="${e.target.result}" style="width:100%; max-height:450px; border-radius:8px; display:block; background:#000;"></video>
                `;
                document.getElementById('editor').appendChild(wrapper);
                input.value = ''; // 清空以允许重复选择同一文件
            };
            reader.readAsDataURL(file);
        }

        // 完美修复版：使用弹窗按钮触发下载，彻底解决手机浏览器拦截导出无反应的问题
        function exportNotebookModal() {
            const titleInput = document.querySelector('.title-input').value.trim();
            const title = titleInput ? titleInput : '我的笔记';
            const content = document.getElementById('editor').innerHTML;
            
            const data = {
                title: title,
                content: content,
                version: "10.3",
                timestamp: new Date().toISOString()
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const modal = document.getElementById('exportModal');
            const area = document.getElementById('downloadLinkArea');
            
            const filename = title.replace(/[\/\\?%*:|"<>]/g, '_') + ".notebook";
            
            area.innerHTML = `
                <a href="${dataStr}" download="${filename}" class="btn-primary" style="display: inline-block; padding: 12px 24px; text-decoration: none; font-size: 18px; border-radius: 6px; background: #0066ff !important; color: #fff !important;">
                    👉 点击这里下载 ${filename}
                </a>
            `;
            modal.style.display = 'flex';
        }

        function closeExportModal() {
            document.getElementById('exportModal').style.display = 'none';
        }
    </script>
</body>
</html>
