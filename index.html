<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jkai Notebook - 个人创意与 HTML 嵌入工作台</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #222222;
            --border-color: #e5e5e5;
            --accent-color: #0066ff;
            --panel-bg: #f8f9fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 20px;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
        }
        .logo { font-weight: bold; font-size: 22px; color: var(--accent-color); }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button, select {
            padding: 8px 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover, select:hover { background: var(--panel-bg); border-color: var(--accent-color); }
        .btn-primary { background: var(--accent-color); color: #fff; border: none; }
        .btn-primary:hover { background: #0052cc; }
        
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }
        .title-input {
            font-size: 28px;
            font-weight: bold;
            border: none;
            outline: none;
            margin-bottom: 16px;
            width: 100%;
            font-family: inherit;
        }
        .content-editable {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            outline: none;
            overflow-y: auto;
            min-height: 300px;
            background: #fff;
            font-size: 20px;
        }
        
        /* 嵌入式 HTML 预览窗口样式 */
        .html-embed-box {
            border: 2px dashed var(--accent-color);
            border-radius: 8px;
            margin: 16px 0;
            background: var(--panel-bg);
            overflow: hidden;
            resize: vertical;
            min-height: 250px;
        }
        .html-embed-header {
            background: #eef2f7;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            color: #444;
            border-bottom: 1px solid var(--border-color);
        }
        .html-embed-body {
            display: flex;
            height: calc(100% - 40px);
        }
        .html-code-input {
            flex: 1;
            border: none;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            outline: none;
            resize: none;
            background: #fafafa;
            border-right: 1px solid var(--border-color);
        }
        .html-preview-frame {
            flex: 1;
            border: none;
            background: #fff;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Jkai Notebook</div>
        <div class="toolbar">
            <select id="fontSizeSelector" onchange="changeFontSize(this.value)">
                <option value="16px">标准 (16px)</option>
                <option value="20px" selected>舒适 (20px)</option>
                <option value="28px">大号 (28px)</option>
                <option value="48px">特大 (48px)</option>
            </select>
            <button onclick="insertHtmlBox()">➕ 插入 HTML 嵌入预览</button>
            <button class="btn-primary" onclick="triggerAiAssistant()">✨ AI 智能写作</button>
            <button onclick="exportNotebook()">导出 .notebook</button>
        </div>
    </header>

    <div class="main-container">
        <div class="editor-area">
            <input type="text" class="title-input" placeholder="输入文章标题..." value="我的创意网页笔记">
            <div id="editor" class="content-editable" contenteditable="true">
                欢迎来到你的云端创意工作台！你可以随时在这里输入文字、调整 20 号舒适字号、或者点击上方按钮随时**插入嵌入式 HTML 实时预览沙盒**，直接在笔记里运行和展示你的前端网页或小游戏！
            </div>
        </div>
    </div>

    <script>
        // 改变全局字号
        function changeFontSize(size) {
            document.getElementById('editor').style.fontSize = size;
        }

        // 插入 HTML 嵌入预览沙盒组件
        function insertHtmlBox() {
            const editor = document.getElementById('editor');
            const boxId = 'html-box-' + Date.now();
            
            const wrapper = document.createElement('div');
            wrapper.className = "html-embed-box";
            wrapper.contentEditable = "false"; // 防止破坏沙盒结构
            wrapper.innerHTML = `
                <div class="html-embed-header">
                    <span>⚡ 实时 HTML / JavaScript 嵌入预览窗口</span>
                    <button onclick="this.parentElement.parentElement.remove()" style="padding: 2px 8px; font-size: 12px;">删除</button>
                </div>
                <div class="html-embed-body" style="height: 220px;">
                    <textarea class="html-code-input" placeholder="在此输入 HTML/CSS/JS 代码..." oninput="updatePreview('${boxId}')">&lt;h2 style=&quot;color:#0066ff;&quot;&gt;Hello Jkai!&lt;/h2&gt;&lt;p&gt;这是实时运行的 HTML 内容。&lt;/p&gt;</textarea>
                    <iframe id="${boxId}" class="html-preview-frame"></iframe>
                </div>
            `;
            
            editor.appendChild(wrapper);
            // 初始化渲染一次
            updatePreview(boxId, '<h2 style="color:#0066ff;">Hello Jkai!</h2><p>这是实时运行的 HTML 内容。</p>');
        }

        // 实时更新 iframe 预览
        function updatePreview(frameId, customHtml) {
            const box = document.getElementById(frameId);
            if (!box) return;
            const textarea = box.parentElement.querySelector('.html-code-input');
            const htmlContent = customHtml !== undefined ? customHtml : textarea.value;
            
            const doc = box.contentDocument || box.contentWindow.document;
            doc.open();
            doc.write(htmlContent);
            doc.close();
        }

        // 模拟 AI 助手
        function triggerAiAssistant() {
            const editor = document.getElementById('editor');
            editor.innerHTML += "<p style='color: var(--accent-color);'><b>[AI 提示]：</b>已为您优化文笔并润色论述逻辑！</p>";
        }

        // 导出笔记本
        function exportNotebook() {
            const title = document.querySelector('.title-input').value;
            const content = document.getElementById('editor').innerHTML;
            const data = { title, content, version: "1.0", timestamp: new Date().toISOString() };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (title || 'notebook') + '.notebook';
            a.click();
        }
    </script>
</body>
</html>
